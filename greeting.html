<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인사말 | 한국자산관리원</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <div id="header-container"></div>


    <section class="page-title">

        <h1>인사말</h1>
        <p>고객의 자산을 지키고 성장시키는 든든한 파트너</p>

    </section>


    <section class="greeting">

        <div class="greeting-image">
            <img src="about.jpg" alt="대표">
        </div>

        <div class="greeting-text">

            <h2>안녕하십니까.</h2>

            <p>
                한국자산관리원 홈페이지를 방문해 주셔서 진심으로 감사드립니다.
            </p>

            <p>
                저희는 부동산 자산관리 전문기관으로
                전세사기 예방, 투자, 경·공매, NPL,
                상속·증여, 임대차 컨설팅 등
                고객의 자산을 종합적으로 관리하고 있습니다.
            </p>

            <p>
                법률, 세무, 감정평가, 건축 등
                각 분야 전문가와 협업하여
                고객에게 최적의 솔루션을 제공합니다.
            </p>

            <h3>한국자산관리원</h3>

        </div>

    </section>

    <script>
    fetch("header.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("header-container").innerHTML = data;
        });
    </script>

</body>
</html>
